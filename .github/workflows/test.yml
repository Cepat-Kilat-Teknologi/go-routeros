name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs only; main runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Change classifier: when a PR or push touches only non-code files (docs,
  # templates, repo metadata), the checks below report as Skipped. Any
  # classification failure is treated as a code change (fail safe).
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          out() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1 ($2)"; exit 0; }
          case "$EVENT" in
            pull_request) RANGE="$PR_BASE...$PR_HEAD" ;;
            push)
              [[ "$REF" == refs/tags/* ]] && out true "tag"
              [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] && out true "new branch"
              RANGE="$BEFORE..$SHA" ;;
            *) out true "event $EVENT" ;;
          esac
          if ! files=$(git diff --no-renames --name-only "$RANGE"); then out true "git diff failed"; fi
          [ -z "$files" ] && out true "no files listed"
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|LICENSE|LICENSE.*|.gitignore|.gitattributes|.editorconfig|.claude/*|CODEOWNERS|\
              .github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|\
              .github/PULL_REQUEST_TEMPLATE/*|.github/dependabot.yml|.github/actionlint.yaml|\
              .gitleaks.toml|.gitleaksignore|.github/workflows/gitleaks.yml|.env.example|.env.*.example|*.http) ;;
              *) out true "code file: $f" ;;
            esac
          done <<< "$files"
          out false "non-code only"

  # Cross-OS matrix. Required-check name is the `test` aggregator below, so
  # branch protection does not depend on matrix-expanded job names.
  test-matrix:
    name: test-matrix
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      matrix:
        go-version: ['1.26']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./api/... ./api/proto/... ./rest/... -v -race -coverprofile=coverage.out -covermode=atomic

      - name: Vet
        run: go vet ./...

      - name: Verify Dependencies
        run: go mod verify

      - name: Coverage Check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 100.0" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 100%"
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Cepat-Kilat-Teknologi/go-routeros
          files: coverage.out
          flags: unittests
          fail_ci_if_error: false

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [changes, test-matrix]
    if: always()
    steps:
      # A skipped matrix is OK only when the changes job classified the change
      # as non-code; a failed, cancelled or unexpectedly skipped matrix fails.
      - name: Check test matrix result
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "test-matrix result: ${MATRIX_RESULT} (code changes: ${CODE})"
          if [ "${MATRIX_RESULT}" = "skipped" ] && [ "${CODE}" = "false" ]; then
            echo "non-code change only; test matrix skipped"
            exit 0
          fi
          if [ "${MATRIX_RESULT}" != "success" ]; then
            echo "::error::test-matrix did not succeed (${MATRIX_RESULT})"
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: golangci-lint
        run: golangci-lint run ./...
