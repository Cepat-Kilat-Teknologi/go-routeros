name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23', '1.24']
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Go 1.21-1.23 link Mach-O binaries without an LC_UUID load command,
        # which the dyld on current macos-latest runners rejects outright:
        # "missing LC_UUID load command" then SIGABRT before any test runs.
        # Only 1.24 produces binaries those runners will load.
        #
        # There is no older macOS image to fall back to — macos-13 was the
        # last Intel one and its label no longer gets a runner, so pinning
        # these cells there just leaves them queued indefinitely.
        #
        # Drop the macOS cells for those toolchains instead. 1.21-1.23 stay
        # covered on ubuntu-latest and windows-latest, so the floor declared
        # in go.mod is still tested — just not on macOS.
        exclude:
          - go-version: '1.21'
            os: macos-latest
          - go-version: '1.22'
            os: macos-latest
          - go-version: '1.23'
            os: macos-latest
    runs-on: ${{ matrix.os }}
    environment: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./api/... ./api/proto/... ./rest/... -v -race -coverprofile=coverage.out -covermode=atomic

      - name: Vet
        run: go vet ./...

      - name: Verify Dependencies
        run: go mod verify

      - name: Coverage Check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 100.0" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 100%"
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.go-version == '1.24' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Cepat-Kilat-Teknologi/go-routeros
          files: coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: golangci-lint
        run: golangci-lint run ./...
